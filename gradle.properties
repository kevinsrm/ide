# Configuracoes globais do build Android
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Ambiente on-device (Termux/Smart IDE): o daemon do compilador Kotlin nao
# inicia de forma confiavel nesse sandbox Android ("Unknown or invalid session"),
# forcando um fallback lento. Compilar em processo e estavel aqui.
kotlin.compiler.execution.strategy=in-process

# Saida sem cores/ANSI: evita o carregamento da lib nativa do Jansi, que falha
# nesse ambiente (libc.so.6 nao encontrada).
org.gradle.console=plain
